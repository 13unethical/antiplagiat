# Render Blueprint — бэкенд (Docker) + managed PostgreSQL.
# Деплой: Render Dashboard → New → Blueprint → выбрать этот репозиторий.
services:
  - type: web
    name: antiplagiat-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free            # 512 МБ RAM; для стабильной работы ML лучше starter+
    autoDeploy: true
    healthCheckPath: /docs
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: antiplagiat-db
          property: connectionString   # postgresql:// → нормализуется в приложении
      - key: FRONTEND_URL
        sync: false        # вписать URL Vercel после деплоя фронтенда
      - key: EMBED_MODEL
        value: BAAI/bge-small-en-v1.5   # лёгкая модель, чтобы не упасть по памяти
      - key: WEB_SEARCH_ENABLED
        value: "false"     # без ключа Brave веб-поиск всё равно отключается

databases:
  - name: antiplagiat-db
    plan: free
